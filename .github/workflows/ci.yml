name: build

on:
  push:
    branches: [ develop, main ]
    tags: [ '*' ]
  pull_request:
    branches: [ develop ]

jobs:

  resources:
    name: Resources tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Test documentation build
        run: Build/Scripts/additionalTests.sh -s buildDocumentation

      - name: Cleanup
        run: Build/Scripts/additionalTests.sh -s clean

  testsuite:
    name: All php tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        packages:
          - php: '8.2'
            core: '^13.0'
            framework: '^9.2.1'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.2'
            core: '^13.0'
            framework: '^9.2.1'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

          - php: '8.3'
            core: '^13.0'
            framework: '^9.2.1'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.3'
            core: '^13.0'
            framework: '^9.2.1'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

          - php: '8.4'
            core: '^13.0'
            framework: '^9.2.1'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.4'
            core: '^13.4'
            framework: '^9.2.1'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

          - php: '8.2'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.2'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

          - php: '8.3'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.3'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

          - php: '8.4'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.4'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

          - php: '8.5'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: ''
            testpath: 'Tests/Functional'

          - php: '8.5'
            core: '^14.3'
            framework: '^9.5.0'
            prefer: '--prefer-lowest'
            testpath: 'Tests/Functional'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: PHP lint
        run: |
          Build/Scripts/runTests.sh \
            -p ${{ matrix.packages.php }} \
            -s lintPhp

      - name: Composer install core
        run: |
          Build/Scripts/runTests.sh \
            -p ${{ matrix.packages.php }} \
            -s composer require ${{ matrix.packages.prefer }} "typo3/cms-core:${{ matrix.packages.core }}"

      - name: Composer install framework
        run: |
          Build/Scripts/runTests.sh \
            -p ${{ matrix.packages.php }} \
            -s composer require --dev ${{ matrix.packages.prefer }} "typo3/testing-framework:${{ matrix.packages.framework }}"

      - name: Composer validate
        run: |
          Build/Scripts/runTests.sh \
            -p ${{ matrix.packages.php }} \
            -s composerValidate

      - name: Functional tests with sqlite
        run: |
          Build/Scripts/runTests.sh \
            -p ${{ matrix.packages.php }} \
            -d sqlite \
            -s functional ${{ matrix.packages.path }}

      - name: Cleanup
        run: |
          Build/Scripts/runTests.sh -s clean
          Build/Scripts/additionalTests.sh -s clean

  TERUpload:
    needs: [ resources, testsuite ]
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    name: TYPO3 TER release
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Publish to TER
        uses: tomasnorre/typo3-upload-ter@v2
        with:
          api-token: ${{ secrets.TYPO3_API_TOKEN }}
